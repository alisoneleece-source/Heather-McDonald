<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#251925">
<title>Live shows · Two-column design preview</title>
<style>
:root{--ink:#251925;--pink:#df337a;--berry:#a91a54;--muted:#61505c}*{box-sizing:border-box}body{margin:0;background:#fff8f2;color:var(--ink);font:16px/1.6 Arial,Helvetica,sans-serif}a{color:inherit}a:focus-visible{outline:3px solid #005fcc;outline-offset:4px}.preview-bar{background:var(--ink);color:white;padding:13px 24px;display:flex;justify-content:space-between;align-items:center;gap:18px;font-size:12px;font-weight:800;letter-spacing:.04em}.preview-bar a{text-underline-offset:4px}.live-section{background:#fff0f5;padding:78px 0 88px;min-height:570px;display:flex;align-items:center}.wrap{width:min(1120px,calc(100% - 48px));margin:auto}.live-grid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(42px,7vw,112px);align-items:center}.live-photo{margin:0;min-width:0;width:min(100%,350px);justify-self:center;aspect-ratio:69/100;border-radius:36px;box-shadow:0 18px 36px rgba(37,25,37,.16);overflow:hidden}.live-photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:center center}.eyebrow{color:var(--berry);font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:900;margin:0 0 19px}.live-copy h1{font:700 clamp(54px,6vw,88px)/.98 Georgia,'Times New Roman',serif;letter-spacing:-.065em;margin:0 0 22px}.live-copy h1 em{font-weight:400;color:var(--pink)}.live-copy p{font-size:17px;color:var(--muted);margin:0 0 27px}.ticket-button{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:13px 22px;background:var(--ink);border:2px solid var(--ink);border-radius:5px;color:white;text-decoration:none;font-size:12px;font-weight:900;letter-spacing:.045em;text-transform:uppercase}.ticket-button:hover{background:var(--berry);border-color:var(--berry)}@media(max-width:720px){.preview-bar{flex-wrap:wrap}.wrap{width:calc(100% - 34px)}.live-section{padding:46px 0 62px;min-height:0}.live-grid{grid-template-columns:1fr;gap:30px}.live-photo{max-width:325px;width:100%;margin:auto;border-radius:30px}.live-copy h1{font-size:clamp(51px,10vw,68px)}}
</style>
</head>
<body>
<div class="preview-bar"><span>INDEPENDENT REDESIGN · TWO-COLUMN LIVE SECTION PREVIEW</span><a href="index.html?desktop=1#shows">← Back to current homepage</a></div>
<main><section class="live-section" aria-labelledby="live-heading"><div class="wrap live-grid"><figure class="live-photo"><img src="Heather%20About%20Page.png?portrait=trimmed-20260918" alt="Heather McDonald posing in a pink dress"></figure><div class="live-copy"><div class="eyebrow">See her live</div><h1 id="live-heading">Some stories<br>are only told<br><em>live.</em></h1><p>Get your tickets now.</p><a class="ticket-button" href="tour.html">See tour dates ↗</a></div></div></section></main>
</body>
</html>
