<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visual editing desk · Draft-safe update</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3edf2;color:#271b28;font:13px/1.45 system-ui,-apple-system,sans-serif}.bar{background:#fff;display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:9px 14px;border-bottom:1px solid #decfdc}.bar strong{font-size:14px;margin-right:auto}.bar button,.bar label{background:#fff;border:1px solid #d8c7d6;border-radius:7px;padding:8px 10px;cursor:pointer;font:700 12px system-ui}.bar button.main{background:#a91a54;color:#fff;border-color:#a91a54}.bar label input{display:none}.bar small{color:#745d6e}.bar output{width:100%;font-size:11px;color:#805368}.frame{width:100%;height:calc(100dvh - 110px);min-height:580px;border:0;display:block}@media(max-width:750px){.frame{height:calc(100dvh - 165px)}.bar strong{width:100%}}
</style></head><body><div class="bar"><strong>Visual editing desk · safer drafts</strong><button id="save" class="main">Save draft</button><label>Import earlier edited HTML<input id="import" type="file" accept=".html,text/html"></label><button id="scoop">Use scoop instead of arrows</button><button id="tint">Make selected scoop dark pink</button><small>Desktop and phone formatting are independent. Existing pages are unchanged.</small><output id="message" role="status">If your earlier editor still has unsaved changes, download its edited HTML first, then import it here.</output></div><iframe class="frame" id="desk" src="visual-editor.html" title="Visual editing desk"></iframe><script>
(()=>{'use strict';const desk=document.getElementById('desk'),msg=document.getElementById('message');let ed=null,site=null,doc=null,db=null,loadCount=0,autoTimer=null;const say=s=>{msg.textContent=s};const svgPaths='M77,397 137,459 159,472 178,477 205,476 228,467 245,453 245,450 241,449 225,462 199,471 178,471 165,468 143,456 83,396 79,395Z M189,258 270,341 284,370 288,398 286,418 280,437 266,460 250,476 235,486 215,494 200,497 177,497 148,489 128,477 49,399 94,367 138,325 167,290Z M169,256 176,264 176,267 137,317 117,338 83,368 57,386 52,384 41,370 38,360 38,342 44,321 53,304 65,288 85,269 115,252 130,248 147,247 159,250Z M465,18 473,30 473,40 470,47 240,301 211,272 439,18 447,14 457,14Z M467,12 457,8 447,8 436,13 207,267 189,250 186,251 180,259 171,250 160,244 145,241 129,242 107,249 83,263 63,281 51,296 38,320 32,342 32,360 35,371 43,384 50,390 42,395 41,399 126,483 147,495 166,501 178,503 206,502 232,494 248,485 273,461 286,438 292,418 292,378 286,358 276,339 246,305 473,53 479,41 479,29 475,20Z';
function database(){return new Promise((resolve,reject)=>{const req=indexedDB.open('heather-visual-drafts-v2',1);req.onupgradeneeded=()=>req.result.createObjectStore('pages');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}database().then(d=>{db=d;say('Ready · Your drafts use larger browser storage.')}).catch(()=>say('Draft storage unavailable. Download edited HTML to keep your work.'));
function store(k,v){return new Promise((resolve,reject)=>{if(!db){reject(Error('IndexedDB unavailable'));return}const tx=db.transaction('pages','readwrite');tx.objectStore('pages').put(v,k);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function retrieve(k){return new Promise(resolve=>{if(!db){resolve(null);return}const tx=db.transaction('pages');const req=tx.objectStore('pages').get(k);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>resolve(null)})}
function currentKey(){return ed?.document.getElementById('page')?.value.split('?')[0]||'index.html'}
function getClean(){if(!doc)return null;const clone=doc.body.cloneNode(true);clone.querySelectorAll('.__ve_selected').forEach(n=>n.classList.remove('__ve_selected'));clone.querySelectorAll('[contenteditable]').forEach(n=>n.removeAttribute('contenteditable'));clone.querySelectorAll('[data-ve-edit],[data-ve-sizing]').forEach(n=>{n.removeAttribute('data-ve-edit');n.removeAttribute('data-ve-sizing')});return {html:clone.innerHTML,css:doc.getElementById('v2-responsive')?.textContent||'',saved:Date.now()}}
async function saveDraft(quiet=false){if(!doc)return;const k=currentKey(),payload=getClean();try{await store(k,payload);if(!quiet)say('Draft saved for '+k+' · Nothing published to the live site.')}catch(e){if(!quiet)say('Could not store draft. Use Download edited HTML in the editor below.')}}
function queue(){clearTimeout(autoTimer);autoTimer=setTimeout(()=>saveDraft(true),800)}
function selected(){return doc?.querySelector('.__ve_selected')||null}
function ensureID(el){if(!el.dataset.v2Id)el.dataset.v2Id='e'+Math.random().toString(36).slice(2,11);return el.dataset.v2Id}
function mode(){return ed?.document.getElementById('stage')?.classList.contains('mobile')?'mobile':'desktop'}
function cssNode(){let st=doc.getElementById('v2-responsive');if(!st){st=doc.createElement('style');st.id='v2-responsive';doc.head.appendChild(st)}return st}
function setRule(el,property,value){if(!el)return;const id=ensureID(el),tag=mode()==='mobile'?'@media(max-width:700px)':'@media(min-width:701px)';const st=cssNode();const escaped=String(value).replace(/[{}]/g,'');const rule=`${tag}{[data-v2-id="${id}"]{${property}:${escaped}!important}}`;st.textContent+='\n'+rule;queue();say('Changed '+mode()+' styling only · Other screen size unaffected.')}
function captureControl(e){const id=e.target?.id||e.target?.closest('button')?.id;if(!doc||!selected())return;if(id==='font-size'&&e.type==='input'){e.stopImmediatePropagation();setRule(selected(),'font-size',e.target.value+'px');ed.document.getElementById('size-label').textContent=e.target.value+'px'}else if(id==='text-color'&&e.type==='change'){e.stopImmediatePropagation();setRule(selected(),'color',e.target.value)}else if(e.type==='click'&&['align-left','align-center','align-right'].includes(id)){e.preventDefault();e.stopImmediatePropagation();setRule(selected(),'text-align',id.slice(6))}else if(['image-x','image-y'].includes(id)&&e.type==='input'){e.stopImmediatePropagation();const x=ed.document.getElementById('image-x').value,y=ed.document.getElementById('image-y').value;setRule(selected(),'object-fit','cover');setRule(selected(),'object-position',x+'% '+y+'%');ed.document.getElementById('x-label').textContent=x+'%';ed.document.getElementById('y-label').textContent=y+'%'}else if(e.type==='click'&&['up','down','left','right'].includes(id)){e.preventDefault();e.stopImmediatePropagation();const el=selected(),ax=el.dataset['v2'+mode()+'X']||'0',ay=el.dataset['v2'+mode()+'Y']||'0';let x=+ax,y=+ay;if(id==='up')y-=6;if(id==='down')y+=6;if(id==='left')x-=6;if(id==='right')x+=6;el.dataset['v2'+mode()+'X']=x;el.dataset['v2'+mode()+'Y']=y;setRule(el,'translate',x+'px '+y+'px')}}
function upload(e){if(e.target.id!=='upload'||!e.target.files?.[0]||!selected()||selected().tagName!=='IMG')return;e.preventDefault();e.stopImmediatePropagation();const f=e.target.files[0],el=selected();if(!f.type.startsWith('image/'))return;const reader=new FileReader();reader.onload=()=>{const image=new Image();image.onload=()=>{const scale=Math.min(1,1800/Math.max(image.width,image.height)),can=document.createElement('canvas');can.width=Math.round(image.width*scale);can.height=Math.round(image.height*scale);can.getContext('2d').drawImage(image,0,0,can.width,can.height);el.src=can.toDataURL(f.type==='image/png'||f.type==='image/webp'?'image/png':'image/jpeg',.85);queue();say('Image replaced · Transparent PNGs stay transparent · Draft autosaves.');};image.src=reader.result};reader.readAsDataURL(f);e.target.value=''}
function initInner(){try{doc=site.contentDocument;if(!doc?.body)throw Error('no document')}catch{return}const count=++loadCount, k=currentKey();retrieve(k).then(payload=>{if(count!==loadCount||!payload||currentKey()!==k)return;doc.body.innerHTML=payload.html;cssNode().textContent=payload.css||'';say('Recovered your saved '+k+' draft. Desktop and phone styles are separate.');});doc.addEventListener('input',queue,true);doc.addEventListener('change',queue,true)}
function mount(){ed=desk.contentWindow;site=ed.document.getElementById('site');if(!site){say('Editor could not load.');return}ed.document.addEventListener('click',e=>{if(e.target.closest('#save')){e.preventDefault();e.stopImmediatePropagation();saveDraft()}else captureControl(e)},true);ed.document.addEventListener('input',captureControl,true);ed.document.addEventListener('change',e=>{if(e.target?.id==='upload')upload(e);else captureControl(e)},true);site.addEventListener('load',()=>setTimeout(initInner,0));if(site.contentDocument?.readyState==='complete')setTimeout(initInner,0);}
desk.addEventListener('load',mount);
document.getElementById('save').onclick=()=>saveDraft();
document.getElementById('import').onchange=async e=>{const f=e.target.files?.[0];if(!f||!doc)return;const html=await f.text(),parsed=new DOMParser().parseFromString(html,'text/html');if(!parsed.body?.children.length){say('That file has no HTML page content.');return}if(!confirm('Import this HTML into the selected page draft? Existing draft will be replaced.'))return;doc.body.innerHTML=parsed.body.innerHTML;const old=parsed.getElementById('v2-responsive');if(old)cssNode().textContent=old.textContent;await saveDraft();say('Imported your previous edits, including any uploaded images.');e.target.value=''};
document.getElementById('scoop').onclick=()=>{if(!doc)return;let n=0;const candidates=[...doc.querySelectorAll('a,button')].filter(el=>!el.closest('header,footer,nav,.drawer,.dock')&&!el.querySelector('.v2-scoop'));for(const el of candidates){const t=[...el.childNodes].reverse().find(x=>x.nodeType===3&&/[↗→➜]\s*$/.test(x.textContent));if(!t)continue;t.textContent=t.textContent.replace(/\s*[↗→➜]\s*$/,'');const icon=doc.createElement('span');icon.className='v2-scoop';icon.setAttribute('aria-hidden','true');icon.innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="#a91a54" width="100%" height="100%"><path fill-rule="evenodd" d="${svgPaths}"/></svg>`;el.appendChild(icon);n++}let style=doc.getElementById('v2-scoop-styling');if(!style){style=doc.createElement('style');style.id='v2-scoop-styling';style.textContent='.v2-scoop{display:inline-block!important;vertical-align:-.16em!important;width:1.05em!important;height:1.05em!important;max-width:1.05em!important;max-height:1.05em!important;flex:0 0 1.05em!important;margin-left:.25em!important;line-height:0!important;transform:none!important}.v2-scoop svg{display:block;width:100%!important;height:100%!important;object-fit:contain!important}';doc.head.appendChild(style)}queue();say(n?`Replaced ${n} action arrows with fixed-size dark-pink scoops. Buttons keep their dimensions.`:'No eligible action arrows found on this page.');};
document.getElementById('tint').onclick=()=>{const img=selected();if(!img||img.tagName!=='IMG'){say('Select the scoop image in the webpage first.');return}const image=new Image();image.onload=()=>{const c=document.createElement('canvas');c.width=image.naturalWidth;c.height=image.naturalHeight;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(image,0,0);const im=ctx.getImageData(0,0,c.width,c.height),d=im.data;let kept=0;for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2],a=d[i+3],diff=Math.min(r-g,b-g);if(a>0&&diff>15){d[i]=169;d[i+1]=26;d[i+2]=84;d[i+3]=Math.round(a*Math.min(1,(diff-15)/35));kept++}else d[i+3]=0}if(!kept){say('This image does not contain the original purple scoop pixels. Nothing changed.');return}ctx.putImageData(im,0,0);img.src=c.toDataURL('image/png');queue();say('Original scoop silhouette preserved · Grey/checkered pixels removed · Dark-pink transparent PNG.');};image.onerror=()=>say('Image cannot be recoloured from this source. Upload the scoop PNG first.');image.src=img.src};
})();
</script></body></html>
